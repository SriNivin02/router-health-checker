<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="RouterGuard mascot - friendly shield">
  <!-- Body: shield shape -->
  <path d="M50 8 L85 22 L85 52 C85 72 65 88 50 95 C35 88 15 72 15 52 L15 22 Z"
        fill="#0d6e8a" stroke="#fff" stroke-width="2"/>
  <!-- Inner shield highlight -->
  <path d="M50 16 L78 27 L78 50 C78 66 62 80 50 86 C38 80 22 66 22 50 L22 27 Z"
        fill="#1a8fad" opacity="0.5"/>
  <!-- Face: eyes -->
  <circle cx="38" cy="46" r="5" fill="#fff"/>
  <circle cx="62" cy="46" r="5" fill="#fff"/>
  <circle cx="40" cy="46" r="2.5" fill="#0d6e8a"/>
  <circle cx="64" cy="46" r="2.5" fill="#0d6e8a"/>
  <!-- Eye shine -->
  <circle cx="41" cy="44.5" r="1" fill="#fff"/>
  <circle cx="65" cy="44.5" r="1" fill="#fff"/>
  <!-- Smile -->
  <path d="M36 58 Q50 68 64 58" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="32" cy="54" r="5" fill="#ff9a6c" opacity="0.5"/>
  <circle cx="68" cy="54" r="5" fill="#ff9a6c" opacity="0.5"/>
  <!-- Wi-Fi antenna -->
  <line x1="50" y1="8" x2="50" y2="2" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="2" r="2" fill="#fbbf24"/>
</svg>
